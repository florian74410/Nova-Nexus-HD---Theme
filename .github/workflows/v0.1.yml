name: v0.1 clean foundation
on:
  push:
    branches: [feature/v0.1-settings-shell]
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - run: python -m pip install -r App/requirements.txt
      - run: python -m compileall -q App
      - run: python -m unittest discover -s tests -v
      - name: Popup smoke test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          XDG_CONFIG_HOME: /tmp/nova-v01-qa
        run: |
          python - <<'PY'
          from PySide6.QtWidgets import QApplication
          from App.main import Settings
          app=QApplication([])
          window=Settings()
          assert window.stack.count()==5
          assert len(window.buttons)==5
          window.show()
          app.processEvents()
          window.show_page(1)
          assert window.stack.currentIndex()==1
          window.close()
          PY
